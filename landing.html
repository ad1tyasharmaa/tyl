<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;background:#0c0c0c;color:#f0ede6;font-family:'Space Mono',monospace}

/* draggable ball */
#ball{
  position:fixed;right:24px;top:24px;
  width:90px;height:90px;border-radius:50%;
  padding:2.5px;
  background:linear-gradient(135deg,#e67e22 0%,#e74c3c 50%,#8b5cf6 100%);
  cursor:grab;z-index:200;
  user-select:none;-webkit-user-select:none;touch-action:none;
  opacity:0;
  animation:ballPop 0.55s cubic-bezier(.34,1.56,.64,1) 0.6s forwards, pulse 2.5s ease-out 1.3s infinite;
}
@keyframes ballPop{from{opacity:0;transform:scale(0.3)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,126,34,0.4)}70%{box-shadow:0 0 0 16px rgba(230,126,34,0)}100%{box-shadow:0 0 0 0 rgba(230,126,34,0)}}
#ball:active{cursor:grabbing}
#ball-inner{width:100%;height:100%;border-radius:50%;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center}
#ball-inner img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;border-radius:50%}
#ball-fb{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:#e67e22;display:none}

/* main */
#wrap{
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:80px 24px 60px;
  opacity:0;animation:fadeIn 0.4s ease 0.1s forwards;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.name{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.7rem,5vw,2.3rem);letter-spacing:-0.03em;color:#f0ede6;margin-bottom:6px}
.tagline{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#444;margin-bottom:44px}

/* buttons */
.links{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}

.btn{
  display:flex;align-items:center;
  width:100%;padding:0 20px;height:64px;
  border-radius:16px;text-decoration:none;
  border:1px solid #1e1e1e;background:#111;color:#f0ede6;
  font-family:'Space Mono',monospace;font-size:13px;letter-spacing:0.04em;
  cursor:pointer;transition:transform 0.15s,background 0.15s,border-color 0.15s;
  opacity:0;
}
.btn:nth-child(1){animation:btnIn 0.4s cubic-bezier(.34,1.4,.64,1) 0.2s forwards}
.btn:nth-child(2){animation:btnIn 0.4s cubic-bezier(.34,1.4,.64,1) 0.3s forwards}
.btn:nth-child(3){animation:btnIn 0.4s cubic-bezier(.34,1.4,.64,1) 0.4s forwards}
.btn:nth-child(4){animation:btnIn 0.4s cubic-bezier(.34,1.4,.64,1) 0.5s forwards}
@keyframes btnIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.btn:hover{transform:scale(1.022);background:#161616;border-color:#2a2a2a}
.btn:active{transform:scale(0.985)}

/* primary (portfolio) */
.btn.primary{background:#f0ede6;color:#0c0c0c;border-color:#f0ede6;font-weight:700}
.btn.primary:hover{background:#e5e1da;border-color:#e5e1da}
.btn.primary .ic{background:rgba(0,0,0,0.09);color:#0c0c0c}

.ic{width:38px;height:38px;border-radius:10px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-right:14px}
.lbl{flex:1;text-align:left}
.arr{font-size:14px;opacity:0.3;transition:opacity 0.15s,transform 0.15s}
.btn:hover .arr{opacity:0.7;transform:translateX(3px)}

.foot{margin-top:40px;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#1e1e1e;text-align:center}
</style>
</head>

<script>
const ball = document.getElementById('ball');
const BALL_SIZE = 90;

// Physics state
let bx = window.innerWidth - BALL_SIZE - 24;
let by = 24;
let vx = (Math.random() > 0.5 ? 1 : -1) * (5 + Math.random() * 4);
let vy = (Math.random() > 0.5 ? 1 : -1) * (4 + Math.random() * 4);
let dragging = false;
let ox = 0, oy = 0;
let lastX = bx, lastY = by;
let animId;

function applyPos(x, y) {
  ball.style.right = 'auto';
  ball.style.left = x + 'px';
  ball.style.top = y + 'px';
}

function bounce() {
  if (dragging) { animId = requestAnimationFrame(bounce); return; }

  bx += vx;
  by += vy;

  const maxX = window.innerWidth - BALL_SIZE;
  const maxY = window.innerHeight - BALL_SIZE;

  // Bounce off walls — full corner reach
  if (bx <= 0) { bx = 0; vx = Math.abs(vx) * (0.97 + Math.random()*0.06); }
  if (bx >= maxX) { bx = maxX; vx = -Math.abs(vx) * (0.97 + Math.random()*0.06); }
  if (by <= 0) { by = 0; vy = Math.abs(vy) * (0.97 + Math.random()*0.06); }
  if (by >= maxY) { by = maxY; vy = -Math.abs(vy) * (0.97 + Math.random()*0.06); }

  // Keep speed up so it always reaches corners
  const speed = Math.sqrt(vx*vx + vy*vy);
  const minSpeed = 7;
  const maxSpeed = 14;
  if (speed < minSpeed) {
    const scale = minSpeed / speed;
    vx *= scale; vy *= scale;
  }
  if (speed > maxSpeed) {
    const scale = maxSpeed / speed;
    vx *= scale; vy *= scale;
  }

  applyPos(bx, by);
  animId = requestAnimationFrame(bounce);
}

// Start bouncing after pop animation
setTimeout(() => {
  ball.style.right = 'auto';
  applyPos(bx, by);
  animId = requestAnimationFrame(bounce);
}, 800);

// Drag support
ball.addEventListener('pointerdown', e => {
  e.preventDefault();
  dragging = true;
  cancelAnimationFrame(animId);
  ball.setPointerCapture(e.pointerId);
  const r = ball.getBoundingClientRect();
  ox = e.clientX - r.left;
  oy = e.clientY - r.top;
  lastX = bx; lastY = by;
  ball.style.transition = 'none';
});

ball.addEventListener('pointermove', e => {
  if (!dragging) return;
  const px = bx, py = by;
  bx = Math.max(0, Math.min(window.innerWidth - BALL_SIZE, e.clientX - ox));
  by = Math.max(0, Math.min(window.innerHeight - BALL_SIZE, e.clientY - oy));
  vx = (bx - px) * 0.7;
  vy = (by - py) * 0.7;
  applyPos(bx, by);
});

ball.addEventListener('pointerup', () => {
  dragging = false;
  // clamp velocity on release
  const speed = Math.sqrt(vx*vx + vy*vy);
  if (speed < 5) { vx = (vx/Math.max(speed,0.1))*5; vy = (vy/Math.max(speed,0.1))*5; }
  if (speed > 16) { vx = (vx/speed)*16; vy = (vy/speed)*16; }
  animId = requestAnimationFrame(bounce);
});

window.addEventListener('resize', () => {
  bx = Math.min(bx, window.innerWidth - BALL_SIZE);
  by = Math.min(by, window.innerHeight - BALL_SIZE);
});
</script>
