<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0c0c0c;color:#f0ede6;font-family:'Space Mono',monospace;min-height:100vh;overflow-x:hidden}
body{display:flex;align-items:center;justify-content:center}

#arena{
  width:100%;max-width:480px;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.5rem;gap:0;position:relative;
}

/* scanlines */
#arena::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:99;
}

/* vignette */
#arena::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.7) 100%);
  pointer-events:none;z-index:98;
}

.eyebrow{
  font-family:'Syne',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:0.35em;color:#444;text-transform:uppercase;
  margin-bottom:1.8rem;
}

/* HP bar */
.hp-section{width:100%;max-width:340px;margin-bottom:0.5rem}
.hp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hp-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:0.06em}
.hp-count{font-size:10px;color:#555;letter-spacing:0.12em}
.hp-track{height:8px;background:#1a1a1a;border-radius:2px;overflow:hidden;border:1px solid #222;position:relative}
#hp-fill{
  height:100%;width:100%;border-radius:2px;
  background:linear-gradient(90deg,#c0392b 0%,#e67e22 40%,#2ecc71 100%);
  background-size:340px 100%;
  transition:width 0.25s cubic-bezier(.4,0,.2,1);
  transform-origin:left;
}

/* Phase dots */
.dots{display:flex;gap:5px;margin-top:6px;margin-bottom:1.4rem}
.dot{width:5px;height:5px;border-radius:50%;background:#222;transition:background 0.3s,transform 0.2s}
.dot.lit{background:#e67e22;transform:scale(1.3)}

/* Boss photo container */
#boss-wrap{
  position:relative;
  width:220px;height:220px;
  cursor:crosshair;
  user-select:none;-webkit-tap-highlight-color:transparent;
  margin-bottom:0.6rem;
  /* no background - pixel art floats free */
}

#boss-img{
  width:100%;height:100%;
  object-fit:contain;object-position:bottom center;
  background:transparent;
  border:none;
  border-radius:0;
  display:block;
  transition:filter 0.08s;
  image-rendering:pixelated;image-rendering:crisp-edges;
}

/* tint handled via CSS filter on img */

/* shake on hit */
@keyframes hitShake{
  0%,100%{transform:translateX(0) rotate(0deg) scale(1)}
  15%{transform:translateX(-14px) rotate(-6deg) scale(0.95)}
  35%{transform:translateX(12px) rotate(5deg) scale(1.02)}
  55%{transform:translateX(-8px) rotate(-3deg) scale(0.97)}
  75%{transform:translateX(6px) rotate(2deg) scale(1.01)}
}
.shaking #boss-img{animation:hitShake 0.32s ease-out}

/* flash white on hit */
@keyframes flashHit{
  0%{filter:brightness(10) saturate(0) !important}
  50%{filter:brightness(3) saturate(0.3) !important}
  100%{filter:none}  /* JS inline filter takes over */
}
.flashing #boss-img{animation:flashHit 0.22s ease-out forwards}

/* boss counter-attack swing */
@keyframes bossSwing{
  0%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(40px) rotate(12deg) scaleX(-1)}
  55%{transform:translateX(-10px) rotate(-3deg) scaleX(-1)}
  80%{transform:translateX(5px) rotate(1deg)}
  100%{transform:translateX(0) rotate(0)}
}
.swinging #boss-img{animation:bossSwing 0.45s ease-out}

/* tap ripple */
.ripple{
  position:absolute;border-radius:50%;
  background:rgba(230,126,34,0.35);
  transform:scale(0);pointer-events:none;
  animation:rippleOut 0.5s ease-out forwards;
}
@keyframes rippleOut{
  to{transform:scale(4);opacity:0}
}

/* damage float */
.dmg{
  position:fixed;pointer-events:none;z-index:200;
  font-family:'Syne',sans-serif;font-weight:800;
  text-shadow:0 2px 6px rgba(0,0,0,0.9);
  animation:floatDmg 0.7s ease-out forwards;
}
@keyframes floatDmg{
  0%{opacity:1;transform:translateY(0) scale(1.1)}
  100%{opacity:0;transform:translateY(-70px) scale(0.7)}
}

/* particle sparks */
.spark{
  position:fixed;pointer-events:none;z-index:200;font-size:18px;
  animation:sparkFly 0.65s ease-out forwards;
}
@keyframes sparkFly{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0.2)}
}

/* tap hint */
#tap-hint{
  font-size:10px;color:#444;letter-spacing:0.2em;text-transform:uppercase;
  margin-top:4px;margin-bottom:1.2rem;
  animation:blinkHint 2s ease-in-out infinite;
}
@keyframes blinkHint{0%,100%{opacity:0.3}50%{opacity:1}}

/* narrative text box */
#narr-box{
  width:100%;max-width:360px;
  background:#111;border:1px solid #222;border-radius:6px;
  padding:0.9rem 1.2rem;margin-bottom:1.5rem;
  min-height:58px;position:relative;
}
#narr-box::before{
  content:'▶';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  font-size:10px;color:#222;
}

/* narrative lines */
.narr-line{
  font-size:12px;line-height:1.65;color:#888;
  animation:lineIn 0.3s ease-out both;
}
.narr-line.action{color:#e67e22;font-style:italic}
.narr-line.hit{color:#e74c3c}
.narr-line.dodge{color:#2ecc71}
.narr-line.critical{color:#f1c40f;font-weight:700}
@keyframes lineIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

/* player health (you) */
.player-hp{
  width:100%;max-width:340px;
  display:flex;align-items:center;gap:10px;
  margin-bottom:1.4rem;
}
.player-hp-label{font-size:10px;color:#444;letter-spacing:0.12em;white-space:nowrap}
.player-hp-track{flex:1;height:5px;background:#1a1a1a;border-radius:2px;overflow:hidden;border:1px solid #1e1e1e}
#player-hp-fill{height:100%;width:100%;background:#2ecc71;transition:width 0.3s;border-radius:2px}

/* boss counter damage */
.boss-dmg{
  position:fixed;pointer-events:none;z-index:200;
  font-family:'Space Mono',monospace;font-size:13px;font-weight:700;
  color:#e74c3c;text-shadow:0 2px 6px rgba(0,0,0,0.9);
  animation:floatDmg 0.7s ease-out forwards;
}

/* VICTORY */
#victory{
  display:none;flex-direction:column;align-items:center;gap:1.1rem;
  animation:victoryIn 0.6s cubic-bezier(.34,1.56,.64,1) both;
  text-align:center;width:100%;max-width:400px;
}
@keyframes victoryIn{
  from{opacity:0;transform:scale(0.8) translateY(20px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.v-title{
  font-family:'Syne',sans-serif;font-size:36px;font-weight:800;
  color:#f0ede6;line-height:1;letter-spacing:-0.02em;
}
.v-sub{font-size:10px;letter-spacing:0.25em;color:#e67e22;text-transform:uppercase}
.v-msg{
  background:#111;border:1px solid #222;border-radius:6px;
  padding:0.9rem 1.2rem;font-size:12px;line-height:1.7;color:#666;
  max-width:340px;
}
.enter-btn{
  display:inline-block;background:#f0ede6;color:#0c0c0c;
  font-family:'Syne',sans-serif;font-weight:800;font-size:13px;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:1rem 2.5rem;border-radius:3px;text-decoration:none;
  transition:background 0.2s,transform 0.1s;border:none;cursor:pointer;
  margin-top:0.3rem;
}
.enter-btn:hover{background:#e67e22;transform:scale(1.04)}
.enter-btn:active{transform:scale(0.97)}

/* confetti */
@keyframes confettiFly{
  0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--dr)) scale(0.3)}
}
.conf{position:fixed;pointer-events:none;z-index:300;
  width:8px;height:8px;border-radius:1px;
  animation:confettiFly 1.2s ease-out forwards}
</style>
</head>

    <div class="hp-section">

    </div>

</div>

];

const TOTAL_HP = 100;
const HITS_TO_WIN = 12;
const dmgPerHit = TOTAL_HP / HITS_TO_WIN;
const BOSS_COUNTER_EVERY = 3;
const BOSS_DMG = 8;

let bossHp = TOTAL_HP;
let playerHp = 100;
let hitCount = 0;
let defeated = false;
let lastHit = 0;

const bossImg = document.getElementById('boss-img');
const bossWrap = document.getElementById('boss-wrap');

// Set initial frame
bossImg.src = FRAMES[0];

// Reapply damage tint filter after flash animation ends
bossImg.addEventListener('animationend', function(e) {
  if (e.animationName === 'flashHit' && !defeated) {
    applyDamageTint();
  }
});

function applyDamageTint() {
  const dmgRatio = (TOTAL_HP - bossHp) / TOTAL_HP;
  if (dmgRatio > 0) {
    const sep = Math.min(dmgRatio * 1.2, 1).toFixed(2);
    const sat = (1 + dmgRatio * 3).toFixed(2);
    const hue = Math.round(dmgRatio * -40);
    bossImg.style.filter = `sepia(${sep}) saturate(${sat}) hue-rotate(${hue}deg)`;
  } else {
    bossImg.style.filter = '';
  }
}

const narratives = [
  {line:"Tap to fight MEEEEEEEEEEE!", cls:""},
  {line:"Your path is blocked !", cls:"action"},
  {line:"/He stumbles back!", cls:""},
  {line:"/He's winding up a punch! 👊", cls:"action"},
  {line:"Direct hit!", cls:"hit"},
  {line:"/He swings and misses!", cls:"dodge"},
  {line:"You dodge my code review!", cls:"dodge"},
  {line:"Critical hit! 💥", cls:"critical"},
  {line:"I'm shaken!", cls:""},
  {line:"One more should do it...", cls:""},
  {line:"/He's on his last legs!", cls:"action"},
  {line:"/FINISH HIM!", cls:"critical"},
];

// build dots
const dotsEl = document.getElementById('dots');
for (let i = 0; i < HITS_TO_WIN; i++) {
  const d = document.createElement('div');
  d.className = 'dot'; d.id = 'd' + i;
  dotsEl.appendChild(d);
}

function onHit(e) {
  e.preventDefault();
  const now = Date.now();
  if (now - lastHit < 120 || defeated) return;
  lastHit = now;

  hitCount = Math.min(hitCount + 1, HITS_TO_WIN);
  bossHp = Math.max(0, TOTAL_HP - (hitCount * dmgPerHit));

  // swap sprite frame
  bossImg.src = FRAMES[Math.min(hitCount - 1, FRAMES.length - 1)];

  // light dot
  const dot = document.getElementById('d' + (hitCount - 1));
  if (dot) dot.classList.add('lit');

  // HP bar
  const pct = (bossHp / TOTAL_HP) * 100;
  document.getElementById('hp-fill').style.width = pct + '%';
  document.getElementById('hp-count').textContent = Math.round(bossHp) + ' HP';

  // shake + flash
  bossWrap.classList.remove('shaking', 'swinging');
  void bossWrap.offsetWidth;
  bossWrap.classList.add('shaking');

  bossImg.classList.remove('flashing');
  void bossImg.offsetWidth;
  bossImg.classList.add('flashing');

  // spawn ripple
  spawnRipple(e, bossWrap);

  // damage float
  spawnDmg(e, Math.round(dmgPerHit), '#e67e22');

  // sparks
  for (let i = 0; i < 5; i++) spawnSpark(e);

  // boss counter attack every 3rd hit
  if (hitCount % BOSS_COUNTER_EVERY === 0 && bossHp > 0) {
    setTimeout(() => {
      bossWrap.classList.remove('swinging');
      void bossWrap.offsetWidth;
      bossWrap.classList.add('swinging');
      playerHp = Math.max(0, playerHp - BOSS_DMG);
      document.getElementById('player-hp-fill').style.width = playerHp + '%';
      document.getElementById('player-hp-count').textContent = playerHp;
      spawnBossDmg();
    }, 250);
  }

  // narrative text
  const n = narratives[Math.min(hitCount, narratives.length - 1)];
  setNarr(n.line, n.cls);

  // check win
  if (bossHp <= 0 && !defeated) {
    defeated = true;
    setTimeout(showVictory, 800);
  }
}

function setNarr(txt, cls) {
  const box = document.getElementById('narr-box');
  box.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'narr-line ' + (cls || '');
  d.innerHTML = txt;
  box.appendChild(d);
}

function spawnRipple(e, parent) {
  const r = parent.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'ripple';
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  el.style.cssText = `width:40px;height:40px;left:${cx - r.left - 20}px;top:${cy - r.top - 20}px`;
  parent.appendChild(el);
  setTimeout(() => el.remove(), 500);
}

function spawnDmg(e, amount, color) {
  const el = document.createElement('div');
  el.className = 'dmg';
  el.textContent = '-' + amount + ' HP';
  el.style.color = color || '#e67e22';
  el.style.fontSize = '18px';
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  el.style.left = (cx + (Math.random() * 40 - 20)) + 'px';
  el.style.top = (cy - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 750);
}

function spawnBossDmg() {
  const ph = document.getElementById('player-hp-fill').getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'boss-dmg';
  el.textContent = '-' + BOSS_DMG + ' HP';
  el.style.left = (ph.left + ph.width / 2 + Math.random() * 30 - 15) + 'px';
  el.style.top = (ph.top - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 750);
}

function spawnSpark(e) {
  const el = document.createElement('div');
  el.className = 'spark';
  const chars = ['✦', '★', '⚡', '◆', '✸'];
  el.textContent = chars[Math.floor(Math.random() * chars.length)];
  el.style.color = ['#e67e22', '#f1c40f', '#e74c3c', '#f0ede6'][Math.floor(Math.random() * 4)];
  el.style.setProperty('--dx', (Math.random() - 0.5) * 100 + 'px');
  el.style.setProperty('--dy', -(Math.random() * 80 + 20) + 'px');
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  el.style.left = (cx + (Math.random() - 0.5) * 40) + 'px';
  el.style.top = (cy + (Math.random() - 0.5) * 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function showVictory() {
  bossImg.style.filter = 'sepia(1) saturate(4) hue-rotate(-40deg) brightness(0.6)';
  document.getElementById('fight-ui').style.display = 'none';
  const v = document.getElementById('victory');
  v.style.display = 'flex';
  const colors = ['#e67e22', '#f1c40f', '#e74c3c', '#2ecc71', '#f0ede6'];
  for (let i = 0; i < 28; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'conf';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 60 + '%';
      el.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px');
      el.style.setProperty('--dy', -(Math.random() * 180 + 40) + 'px');
      el.style.setProperty('--dr', (Math.random() * 360) + 'deg');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }, i * 45);
  }
}

</script>
